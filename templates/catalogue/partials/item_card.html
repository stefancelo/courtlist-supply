<div class="col">
    <article class="card h-100 item-card">
        <img
            src="{{ item.image.url }}"
            class="card-img-top item-card-img"
            alt="{{ item.name }}"
            width="400"
            height="400"
            loading="lazy" />
        <div class="card-body d-flex flex-column">
            <p class="small text-body-secondary mb-1">{{ item.brand.name }}</p>
            <h3 class="h6 card-title">
                <a href="{{ item.get_absolute_url }}" class="stretched-link text-decoration-none text-body">
                    {{ item.name }}
                </a>
            </h3>
            {% if item.rating_count %}
                <p class="small mb-2">
                    {% include "catalogue/partials/stars.html" with value=item.avg_rating %}
                    <span class="text-body-secondary">({{ item.rating_count }})</span>
                </p>
            {% endif %}
            <p class="fw-semibold text-orange mt-auto mb-0">€{{ item.price }}</p>
        </div>
    </article>
</div>
