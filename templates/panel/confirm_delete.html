{% extends "panel/base_panel.html" %}

{% block title %}Delete {{ view.noun }}{% endblock %}
{% block heading %}Delete {{ view.noun }}{% endblock %}

{% block panel_content %}
    <div class="card border-danger">
        <div class="card-body">
            <p>Are you sure you want to delete <strong>{{ object }}</strong>? This can't be undone.</p>
            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, delete</button>
                <a href="{{ view.success_url }}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
