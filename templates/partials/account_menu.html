{% if user.is_authenticated %}
    <div class="dropdown ms-lg-3 mt-2 mt-lg-0">
        <button
            class="btn btn-outline-secondary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">
            <i class="bi bi-person-circle me-1" aria-hidden="true"></i>{{ user.first_name|default:user.username }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="{% url 'accounts:dashboard' %}">Dashboard</a></li>
            <li><a class="dropdown-item" href="{% url 'accounts:profile' %}">Profile</a></li>
            {% if is_courtlist_staff %}
                <li><a class="dropdown-item" href="{% url 'orders:list' %}">My orders</a></li>
            {% endif %}
            {% if user.is_superuser %}
                <li><a class="dropdown-item" href="{% url 'admin:index' %}">Django admin</a></li>
            {% endif %}
            <li><hr class="dropdown-divider" /></li>
            <li>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="dropdown-item">Log out</button>
                </form>
            </li>
        </ul>
    </div>
{% else %}
    <div class="d-flex gap-2 ms-lg-3 mt-2 mt-lg-0">
        <a class="btn btn-outline-secondary" href="{% url 'accounts:login' %}">Log in</a>
        <a class="btn btn-orange" href="{% url 'accounts:register' %}">Register</a>
    </div>
{% endif %}
